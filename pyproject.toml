[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-llm-hallucination-critic"
version = "2.0.0"
description = "MedFact-Critic: Clinical Fact-Checking & Citation Verification Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clinical-llm-hallucination-critic = "medfact_critic.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clinical-llm-hallucination-critic"
Repository = "https://github.com/abusuraihsakhri/clinical-llm-hallucination-critic.git"
