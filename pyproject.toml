[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-llm-hallucination-critic"
version = "2.1.0"
description = "Deterministic rule-based prototype for exercising clinical LLM critic workflows"
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "build>=1.2,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
    "setuptools>=83,<85",
]

[project.scripts]
clinical-llm-hallucination-critic = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clinical-llm-hallucination-critic"
Repository = "https://github.com/abusuraihsakhri/clinical-llm-hallucination-critic.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "medfact_critic_app"]

[tool.setuptools.packages.find]
include = ["agents*", "medfact_critic*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
