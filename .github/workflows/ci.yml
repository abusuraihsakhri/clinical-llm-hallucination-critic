name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q agents medfact_critic cli.py enrichment.py simulator.py
      - name: Test
        run: python -m pytest -p no:zarr -v
      - name: Build package
        run: python -m build
      - name: Audit dependencies
        run: python -m pip_audit
      - name: CLI smoke test
        run: |
          clinical-llm-hallucination-critic batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
